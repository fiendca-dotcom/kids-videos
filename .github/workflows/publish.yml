name: Publish kids video
on:
  # schedule paused - re-enable after approval:
  # schedule:
  #   - cron: "0 14 * * 0,2,4"
  workflow_dispatch:
    inputs:
      test:
        description: "Test only (no upload)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji libraqm0
      - run: pip install Pillow numpy edge-tts google-api-python-client google-auth
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python bot.py --dry-run
      - if: ${{ github.event_name == 'schedule' || !inputs.test }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python bot.py
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add state.json && git commit -m "episode" && git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
