name: Publish kids video
on:
  schedule:
    - cron: "0 14 * * 0,2,4"
  workflow_dispatch:
    inputs:
      test:
        description: "Test only (no upload)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji libraqm0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dreamshaper8-lcm-v1
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install Pillow numpy scipy edge-tts google-api-python-client google-auth diffusers transformers accelerate peft safetensors
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: |
          python bot.py --dry-run
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add assets/lib 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "art library" && git pull --rebase --autostash origin main && git push)
      - if: ${{ github.event_name == 'schedule' || !inputs.test }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_HE: ${{ secrets.YT_REFRESH_TOKEN_HE }}
          YT_REFRESH_TOKEN_AR: ${{ secrets.YT_REFRESH_TOKEN_AR }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
        run: |
          python bot.py
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add state.json && (git add assets/lib 2>/dev/null || true) && git commit -m "episode"
          git pull --rebase --autostash origin main && git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*
