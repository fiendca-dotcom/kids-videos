name: art-library
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art-library
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dreamshaper-xl-v1
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install Pillow numpy scipy diffusers transformers accelerate peft safetensors opencv-python-headless
      - name: Build picture library
        env:
          ART_XL: "1"
        run: python artlib.py --budget=18000
      - name: Save library
        run: |
          git config user.name "nuni-bot"
          git config user.email "nuni-bot@users.noreply.github.com"
          git add assets/lib
          git diff --cached --quiet || git commit -m "art library (nightly)"
          git pull --rebase --autostash
          git push
