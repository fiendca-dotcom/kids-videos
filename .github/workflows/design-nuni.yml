name: design-nuni
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 design_nuni.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuni-design
          path: design/
