name: art-test
on:
  workflow_dispatch:
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dreamshaper8-lcm-v1
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji libraqm0
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install Pillow numpy scipy diffusers transformers accelerate peft safetensors opencv-python-headless
      - run: nproc && free -h && python artgen.py --demo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-demo
          path: out/art_demo/*
