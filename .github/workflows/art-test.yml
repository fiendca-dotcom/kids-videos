name: art-test
# Makes 10 sample pictures through the real episode path (local SDXL -> AI cut-out -> quality gates)
on:
  workflow_dispatch:
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dreamshaper-xl-v1
      - uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-isnet-v2
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji libraqm0
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install Pillow numpy scipy diffusers transformers accelerate peft safetensors opencv-python-headless rembg onnxruntime
      - env:
          ART_XL: "1"
        run: nproc && free -h && python artgen.py --demo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-demo
          path: out/art_demo/*
