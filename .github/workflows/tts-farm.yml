name: tts-farm
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 farm/tts_farm.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-audio
          path: farm_audio/
